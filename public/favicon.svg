<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favSilverRing" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="75%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>

    <linearGradient id="favCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="30%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <clipPath id="favPoleClip">
      <rect x="52" y="38" width="16" height="44" rx="2" />
    </clipPath>
  </defs>

  <!-- Circular background for dark mode / browser tab clarity -->
  <circle cx="60" cy="60" r="56" fill="#0c0d0e"/>

  <!-- Outer Silver Ring -->
  <circle cx="60" cy="60" r="48" stroke="url(#favSilverRing)" stroke-width="5.5" fill="none"/>
  <circle cx="60" cy="60" r="44.5" stroke="#6b7280" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Top Finial Ball & Crown -->
  <circle cx="60" cy="22" r="3.5" fill="url(#favCapGrad)" stroke="#111827" stroke-width="0.7"/>
  <path d="M57 25.5 C57 24 63 24 63 25.5 L64 28.5 L56 28.5 Z" fill="url(#favCapGrad)" stroke="#111827" stroke-width="0.6"/>
  <path d="M54 28.5 L66 28.5 L67 34 L53 34 Z" fill="url(#favCapGrad)" stroke="#111827" stroke-width="0.7"/>
  <rect x="51" y="34" width="18" height="4.5" rx="1" fill="url(#favCapGrad)" stroke="#111827" stroke-width="0.7"/>

  <!-- Glass Cylinder -->
  <rect x="52" y="38.5" width="16" height="43" rx="1" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>

  <!-- Barber Pole Stripes -->
  <g clip-path="url(#favPoleClip)">
    <rect x="52" y="38.5" width="16" height="43" fill="#ffffff"/>
    <polygon points="48,36 60,36 74,52 74,57" fill="#111827"/>
    <polygon points="48,46 60,46 74,62 74,67" fill="#111827"/>
    <polygon points="48,56 60,56 74,72 74,77" fill="#111827"/>
    <polygon points="48,66 60,66 74,82 74,87" fill="#111827"/>
    <polygon points="48,76 60,76 74,92 74,97" fill="#111827"/>
    <rect x="53.5" y="38" width="2" height="44" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Bottom Cap Collar & Base -->
  <rect x="51" y="81.5" width="18" height="4.5" rx="1" fill="url(#favCapGrad)" stroke="#111827" stroke-width="0.7"/>
  <path d="M53 86 L67 86 L65 91.5 L55 91.5 Z" fill="url(#favCapGrad)" stroke="#111827" stroke-width="0.7"/>
  <path d="M56 91.5 L64 91.5 L62 94.5 L58 94.5 Z" fill="url(#favCapGrad)" stroke="#111827" stroke-width="0.6"/>
  <circle cx="60" cy="97" r="3" fill="url(#favCapGrad)" stroke="#111827" stroke-width="0.7"/>
</svg>
